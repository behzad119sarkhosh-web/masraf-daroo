name: Build Android app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk masraf-daroo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: masraf-daroo-apk
          path: masraf-daroo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مصرف دارو – نسخه ۱.۰.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            فایل masraf-daroo.apk را روی گوشی اندروید دانلود و نصب کنید.
          files: masraf-daroo.apk
