name: Build apps (Android + iPhone)

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk masraf-daroo.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r masraf-daroo.apk
            adb logcat -c
            adb shell am start -W -n ir.masrafdaroo.app/.MainActivity
            sleep 15
            adb exec-out screencap -p > android-screen.png
            adb logcat -d > android-logcat.txt
            adb shell pidof ir.masrafdaroo.app || (echo "::error::App is not running (crashed)"; grep -E "FATAL|AndroidRuntime" android-logcat.txt; exit 1)
            if grep -E "FATAL EXCEPTION" android-logcat.txt; then echo "::error::App crashed"; exit 1; fi
            if grep -E "chromium.*Uncaught|Console.*Uncaught" android-logcat.txt; then echo "::error::JavaScript error in page"; exit 1; fi
            echo "Android app started and is running without errors"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            masraf-daroo.apk
            android-screen.png
            android-logcat.txt

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          brew install xcodegen
          mkdir -p ios/www
          cp index.html manifest.webmanifest sw.js *.png ios/www/
          cd ios && xcodegen generate

      - name: Build for iPhone (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project MasrafDaroo.xcodeproj -scheme MasrafDaroo -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MasrafDaroo.app Payload/
          zip -qry ../masraf-daroo.ipa Payload

      - name: Test on iPhone simulator
        working-directory: ios
        run: |
          xcodebuild -project MasrafDaroo.xcodeproj -scheme MasrafDaroo -configuration Debug \
            -sdk iphonesimulator -derivedDataPath simbuild -destination 'generic/platform=iOS Simulator' build
          DEV=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[0-9]" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/MasrafDaroo.app
          xcrun simctl launch "$DEV" ir.masrafdaroo.app
          sleep 15
          xcrun simctl io "$DEV" screenshot ../ios-screen.png
          if ! xcrun simctl spawn "$DEV" launchctl list | grep -q ir.masrafdaroo.app; then
            echo "::error::App is not running (crashed)"; exit 1
          fi
          echo "iPhone app started and is running without errors"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            masraf-daroo.ipa
            ios-screen.png

  release:
    # Publish whenever Android passed; the iPhone file is attached if its build passed too.
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مصرف دارو – نسخه ۱.۰.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **اندروید:** فایل `masraf-daroo.apk` را روی گوشی دانلود و نصب کنید.
            **آیفون:** فایل `masraf-daroo.ipa` را با Sideloadly یا AltStore نصب کنید (یا سایت را در Safari باز کرده و Add to Home Screen بزنید).
          fail_on_unmatched_files: false
          files: |
            android/masraf-daroo.apk
            ios/masraf-daroo.ipa
            android/android-screen.png
            ios/ios-screen.png
