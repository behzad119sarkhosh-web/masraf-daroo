plugins { id "com.android.application" }

// The web app (repo root) is copied into the APK so it works fully offline.
def webRoot = rootProject.file("..")
def webOut = layout.buildDirectory.dir("generated/web")

tasks.register("copyWebApp", Copy) {
    from(webRoot) {
        include "index.html", "manifest.webmanifest", "sw.js", "*.png", "splash.jpg", "fonts/*.woff2"
    }
    into webOut.map { it.dir("www") }
}

android {
    namespace "ir.masrafdaroo.app"
    compileSdk 35

    defaultConfig {
        applicationId "ir.masrafdaroo.app"
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Release signing key comes from GitHub Secrets (see .github/workflows/apps.yml).
    // Never commit a keystore: anyone holding it can publish "updates" of this app.
    // Without the secrets (e.g. a local build) the APK is debug-signed and is not published.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            upload {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.upload : signingConfigs.debug
        }
    }

    sourceSets {
        main { assets.srcDir(webOut) }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild") { dependsOn "copyWebApp" }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
