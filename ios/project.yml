name: MasrafDaroo
options:
  bundleIdPrefix: ir.masrafdaroo
  deploymentTarget:
    iOS: "15.0"
targets:
  MasrafDaroo:
    type: application
    platform: iOS
    sources:
      - path: MasrafDaroo
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.masrafdaroo.app
        PRODUCT_NAME: MasrafDaroo
        INFOPLIST_FILE: MasrafDaroo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
